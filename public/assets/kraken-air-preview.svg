<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="krakenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#krakenBg)" rx="16"/>

  <!-- Background 3D Grid Lines -->
  <path d="M 0 350 Q 400 280 800 350" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3"/>
  <path d="M 0 400 Q 400 310 800 400" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.2"/>
  <path d="M 0 450 Q 400 340 800 450" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.1"/>

  <!-- Top Header -->
  <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="24" letter-spacing="4">KRAKEN AIR // 3D EXPERIENCE</text>
  <rect x="620" y="45" width="130" height="35" fill="none" stroke="#00f0ff" stroke-width="1.5" rx="20"/>
  <text x="642" y="68" fill="#00f0ff" font-family="monospace" font-weight="bold" font-size="12">60 FPS WEBGL</text>

  <!-- 3D Sneaker Silhouette / Graphic -->
  <g filter="url(#purpleGlow)" transform="translate(180, 110)">
    <!-- Main Sole -->
    <path d="M 30 220 Q 80 240 180 235 Q 320 230 420 180 Q 430 170 410 160 Q 340 165 240 175 Q 120 190 30 220 Z" fill="url(#cyanAccent)"/>
    <!-- Upper Shoe Body -->
    <path d="M 60 210 C 90 140, 150 100, 220 90 C 270 85, 310 120, 360 140 C 390 152, 410 160, 400 170 C 320 175, 220 185, 60 210 Z" fill="url(#neonPurple)"/>
    <!-- Collar & Tongue -->
    <path d="M 120 130 C 130 80, 180 50, 220 90 Z" fill="#00f0ff" opacity="0.8"/>
    <!-- Swoosh / Accent Line -->
    <path d="M 140 160 Q 240 120 340 155" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Interactive Controls Overlay -->
  <rect x="50" y="380" width="300" height="70" fill="#0f172a" fill-opacity="0.8" rx="12" stroke="#a855f7" stroke-width="1"/>
  <text x="70" y="405" fill="#94a3b8" font-family="sans-serif" font-size="11">COLORWAY CUSTOMIZER</text>
  <circle cx="80" cy="430" r="12" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
  <circle cx="115" cy="430" r="12" fill="#a855f7"/>
  <circle cx="150" cy="430" r="12" fill="#ec4899"/>
  <circle cx="185" cy="430" r="12" fill="#10b981"/>
  <circle cx="220" cy="430" r="12" fill="#f59e0b"/>

  <rect x="580" y="380" width="170" height="70" fill="url(#neonPurple)" rx="12"/>
  <text x="610" y="422" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">BUY NOW • $249</text>
</svg>
