<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3" rx="12"/>

  <!-- POS Header -->
  <rect x="40" y="40" width="720" height="60" fill="url(#cardGrad)" rx="8" stroke="#334155" stroke-width="1"/>
  <circle cx="70" cy="70" r="10" fill="#ef4444"/>
  <circle cx="100" cy="70" r="10" fill="#f59e0b"/>
  <circle cx="130" cy="70" r="10" fill="#10b981"/>
  <text x="170" y="76" fill="#00f0ff" font-family="monospace" font-weight="bold" font-size="18">TOKO LALA POS // CLOUD ECOSYSTEM</text>
  <rect x="620" y="55" width="120" height="30" fill="#10b981" fill-opacity="0.2" stroke="#10b981" rx="6"/>
  <text x="635" y="75" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="12">ONLINE • 15 Cabang</text>

  <!-- POS Main Layout -->
  <!-- Left Side: Product Grid -->
  <rect x="40" y="120" width="460" height="340" fill="url(#cardGrad)" rx="8" stroke="#334155"/>
  <text x="60" y="150" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">PRODUK TERLARIS</text>

  <!-- Product Item 1 -->
  <rect x="60" y="170" width="130" height="110" fill="#0f172a" rx="8" stroke="#00f0ff" stroke-width="1"/>
  <rect x="75" y="185" width="40" height="40" fill="#3b82f6" rx="6"/>
  <text x="75" y="245" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Minyak Goreng 2L</text>
  <text x="75" y="265" fill="#00f0ff" font-family="monospace" font-size="12">Rp 34.000</text>

  <!-- Product Item 2 -->
  <rect x="205" y="170" width="130" height="110" fill="#0f172a" rx="8" stroke="#334155"/>
  <rect x="220" y="185" width="40" height="40" fill="#10b981" rx="6"/>
  <text x="220" y="245" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Beras Premium 5kg</text>
  <text x="220" y="265" fill="#00f0ff" font-family="monospace" font-size="12">Rp 72.000</text>

  <!-- Product Item 3 -->
  <rect x="350" y="170" width="130" height="110" fill="#0f172a" rx="8" stroke="#334155"/>
  <rect x="365" y="185" width="40" height="40" fill="#a855f7" rx="6"/>
  <text x="365" y="245" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Gula Pasir 1kg</text>
  <text x="365" y="265" fill="#00f0ff" font-family="monospace" font-size="12">Rp 16.500</text>

  <!-- Product Row 2 -->
  <rect x="60" y="295" width="130" height="110" fill="#0f172a" rx="8" stroke="#334155"/>
  <rect x="75" y="310" width="40" height="40" fill="#f59e0b" rx="6"/>
  <text x="75" y="370" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Kopi Instant 10s</text>
  <text x="75" y="390" fill="#00f0ff" font-family="monospace" font-size="12">Rp 14.000</text>

  <rect x="205" y="295" width="130" height="110" fill="#0f172a" rx="8" stroke="#334155"/>
  <rect x="220" y="310" width="40" height="40" fill="#ec4899" rx="6"/>
  <text x="220" y="370" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Susu UHT 1L</text>
  <text x="220" y="390" fill="#00f0ff" font-family="monospace" font-size="12">Rp 19.000</text>

  <rect x="350" y="295" width="130" height="110" fill="#0f172a" rx="8" stroke="#334155"/>
  <rect x="365" y="310" width="40" height="40" fill="#06b6d4" rx="6"/>
  <text x="365" y="370" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Mie Instant Dus</text>
  <text x="365" y="390" fill="#00f0ff" font-family="monospace" font-size="12">Rp 112.000</text>

  <!-- Right Side: Receipt & Checkout -->
  <rect x="520" y="120" width="240" height="340" fill="url(#cardGrad)" rx="8" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="540" y="155" fill="#00f0ff" font-family="monospace" font-weight="bold" font-size="14">ORDER SUMMARY #0482</text>
  <line x1="540" y1="170" x2="740" y2="170" stroke="#334155" stroke-dasharray="4 4"/>

  <text x="540" y="195" fill="#f8fafc" font-family="sans-serif" font-size="12">1x Minyak Goreng 2L</text>
  <text x="700" y="195" fill="#94a3b8" font-family="monospace" font-size="12">34k</text>

  <text x="540" y="225" fill="#f8fafc" font-family="sans-serif" font-size="12">2x Beras Premium 5kg</text>
  <text x="693" y="225" fill="#94a3b8" font-family="monospace" font-size="12">144k</text>

  <text x="540" y="255" fill="#f8fafc" font-family="sans-serif" font-size="12">3x Gula Pasir 1kg</text>
  <text x="700" y="255" fill="#94a3b8" font-family="monospace" font-size="12">49.5k</text>

  <line x1="540" y1="285" x2="740" y2="285" stroke="#00f0ff" stroke-width="1"/>

  <text x="540" y="315" fill="#94a3b8" font-family="sans-serif" font-size="13">SUBTOTAL</text>
  <text x="680" y="315" fill="#f8fafc" font-family="monospace" font-size="13">Rp 227.500</text>

  <rect x="540" y="340" width="200" height="45" fill="url(#cyanGlow)" rx="8"/>
  <text x="585" y="368" fill="#020617" font-family="sans-serif" font-weight="extrabold" font-size="15">BAYAR (QRIS/CASH)</text>
</svg>
